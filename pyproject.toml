[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-text-to-sql"
version = "0.1.0"
description = "QLoRA fine-tuning of Qwen2.5-1.5B for WikiSQL text-to-SQL, with an execution-match evaluation harness."
requires-python = ">=3.10"
dependencies = [
    # torch is deliberately NOT listed here. It must come from the CUDA wheel
    # index, not PyPI (the PyPI build is CPU-only on Windows and cannot run
    # bitsandbytes 4-bit kernels) -- see docs/SETUP.md step 3. Listing it here
    # would not prevent that trap; it would just be one more place a plain
    # `torch` entry could silently resolve the wrong wheel.
    #
    # Versions are pinned exactly (not >=) because the project's central claim
    # is a before/after comparison: a transformers or peft upgrade mid-project
    # could shift the numbers for reasons unrelated to fine-tuning (D-005).
    "transformers==5.14.1",
    "peft==0.20.0",
    "trl==1.9.2",
    "bitsandbytes==0.50.0",
    "accelerate==1.14.0",
    "datasets==5.0.1",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
# The GPU stack (torch, transformers, peft, trl, bitsandbytes, accelerate,
# datasets) ships no bundled type stubs mypy can find without installing the
# real ~2 GB packages, which CI deliberately does not do (see ci.yml). This
# is a stub-availability gap, not a signal to skip checking these modules.
ignore_missing_imports = true
